name: Windows x64 build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify SDK and model
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Test rules and publish Windows x64
        shell: pwsh
        run: ./scripts/build.ps1 -Publish
      - name: Check published resources
        shell: pwsh
        run: |
          $required = @(
            'dist/GlanceNext/GlanceNext.Desktop.exe',
            'dist/GlanceNext/GlanceNext.Desktop.pri',
            'dist/GlanceNext/MainWindow.xbf',
            'dist/GlanceNext/ReminderWindow.xbf',
            'dist/GlanceNext/Models/face_detection_yunet_2026may.onnx',
            'dist/GlanceNext/Models/LICENSE.YuNet.txt'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing published resource: $path" }
          }
